[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mikrofon"
version = "1.0.0"
description = "Real-time microphone noise suppression and voice enhancer for budget microphones"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
mikrofon = "mikrofon:main"

[tool.setuptools.packages.find]
include = ["mikrofon_dsp*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

